Enter<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 لوحة تحكم JETTON</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0e17;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #e8e6e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .panel {
            max-width: 500px;
            width: 100%;
            background: #111927;
            padding: 30px;
            border-radius: 30px;
            border: 1px solid #f7931a40;
            box-shadow: 0 0 60px #f7931a30;
        }
        .panel h1 {
            text-align: center;
            font-size: 1.8rem;
            color: #f7931a;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: #8a9aae;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 15px;
            border: 2px solid #f7931a40;
            background: #0d1624;
            color: #e8e6e0;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }
        .form-group input:focus {
            border-color: #f7931a;
            box-shadow: 0 0 20px #f7931a30;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 15px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
            background: linear-gradient(135deg, #f7931a, #d4790e);
            color: #0a0e17;
        }
        .btn:hover { transform: scale(1.02); }
        .btn.danger {
            background: linear-gradient(135deg, #eb5757, #c0392b);
            color: #fff;
            margin-top: 10px;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 15px;
            background: #0d1624;
            border: 1px solid #f7931a40;
            font-size: 0.9rem;
        }
        .status .label { color: #8a9aae; }
        .status .value { color: #f7931a; font-weight: bold; }
        .status .value.success { color: #6fcf97; }
        .status .value.danger { color: #eb5757; }
    </style>
</head>
<body>
<div class="panel">
    <h1>🔐 لوحة التحكم</h1>
    
    <div class="form-group">
        <label>🤖 توكن البوت</label>
        <input type="text" id="botToken" placeholder="أدخل توكن البوت" value="8577508771:AAF-VBCR_jnX-YQ22HUj972_iHkjN9TeHlY">
    </div>
    
    <div class="form-group">
        <label>🆔 أيدي المشرف</label>
        <input type="text" id="adminId" placeholder="أدخل أيدي حسابك" value="7513557249">
    </div>
    
    <button class="btn" onclick="saveSettings()">💾 حفظ الإعدادات</button>
    <button class="btn danger" onclick="resetGame()">🔄 إعادة تعيين اللعبة</button>
    
    <div class="status" id="status">
        <div><span class="label">📡 حالة البوت:</span> <span class="value success" id="botStatus">🟢 متصل</span></div>
        <div style="margin-top:8px;"><span class="label">👤 المشرف:</span> <span class="value" id="adminDisplay">7513557249</span></div>
        <div style="margin-top:8px;"><span class="label">💰 رصيد اللاعب:</span> <span class="value" id="playerBalance">3208</span></div>
    </div>
</div>

<script>
    function saveSettings() {
        const token = document.getElementById('botToken').value;
        const adminId = document.getElementById('adminId').value;
        if (!token || !adminId) {
            alert('يرجى ملء جميع الحقول');
            return;
        }
        localStorage.setItem('botToken', token);
        localStorage.setItem('adminId', adminId);
        document.getElementById('adminDisplay').textContent = adminId;
        alert('✅ تم حفظ الإعدادات بنجاح');
    }
    
    function resetGame() {
        if (confirm('⚠️ هل أنت متأكد من إعادة تعيين اللعبة؟')) {
            localStorage.removeItem('jettonBalance');
            localStorage.removeItem('jettonDaily');
            document.getElementById('playerBalance').textContent = '1000';
            alert('🔄 تم إعادة تعيين اللعبة');
        }
    }
    
    // تحميل الإعدادات المحفوظة
    window.onload = function() {
        const token = localStorage.getItem('botToken');
        const adminId = localStorage.getItem('adminId');
        if (token) document.getElementById('botToken').value = token;
        if (adminId) {
            document.getElementById('adminId').value = adminId;
            document.getElementById('adminDisplay').textContent = adminId;
        }
        const balance = localStorage.getItem('jettonBalance');
        if (balance) document.getElementById('playerBalance').textContent = balance;
    };
</script>
</body>
</html>
