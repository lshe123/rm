<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epic Gift - صناديق TON</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0e17;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            color: #e8e6e0;
            padding: 15px;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: #111927;
            border-radius: 40px;
            padding: 25px;
            border: 1px solid #f7931a60;
            box-shadow: 0 0 70px #f7931a30;
        }
        .header {
            text-align: center;
            border-bottom: 1px solid #f7931a40;
            padding-bottom: 15px;
        }
        .header h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #f7931a, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .balance-box {
            background: #1a2538;
            padding: 18px;
            border-radius: 60px;
            margin: 18px 0;
            text-align: center;
            font-size: 2rem;
            border: 1px solid #f7931a;
            box-shadow: inset 0 0 25px #f7931a20;
        }
        .balance-box span { color: #f7931a; font-weight: bold; }
        .cases-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 18px;
            margin: 25px 0;
        }
        .case-card {
            background: #141e2b;
            padding: 20px 10px;
            border-radius: 30px;
            text-align: center;
            border: 1px solid #f7931a40;
            transition: 0.3s;
            cursor: pointer;
        }
        .case-card:hover {
            transform: translateY(-5px);
            border-color: #f7931a;
            box-shadow: 0 0 40px #f7931a30;
        }
        .case-card .icon { font-size: 3rem; }
        .case-card .price { color: #f7931a; font-weight: bold; font-size: 1.3rem; }
        .case-card .reward-range { font-size: 0.9rem; color: #aab; }
        .result-area {
            background: #0d1624;
            padding: 20px;
            border-radius: 30px;
            margin: 20px 0;
            text-align: center;
            border: 1px dashed #f7931a60;
            min-height: 100px;
        }
        .result-area .prize {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ffd700;
        }
        .btn {
            background: #f7931a;
            border: none;
            padding: 14px 35px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.2rem;
            color: #0a0e17;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 0 30px #f7931a50;
            width: 100%;
        }
        .btn:hover { background: #ffb347; transform: scale(1.02); }
        .btn:active { transform: scale(0.97); }
        .stats {
            display: flex;
            justify-content: space-around;
            margin: 15px 0;
            padding: 12px;
            background: #0d1624;
            border-radius: 30px;
            font-size: 0.95rem;
        }
        .stats div { text-align: center; }
        .stats .num { color: #f7931a; font-weight: bold; font-size: 1.3rem; }
        .history {
            background: #0d1624;
            padding: 12px;
            border-radius: 20px;
            max-height: 130px;
            overflow-y: auto;
            font-size: 0.9rem;
            border: 1px solid #f7931a30;
            margin-top: 15px;
        }
        .history div { padding: 5px 0; border-bottom: 1px solid #1a2538; }
        .win { color: #6fcf97; }
        .lose { color: #eb5757; }
        .reset-btn {
            background: transparent;
            border: 1px solid #f7931a60;
            color: #f7931a;
            padding: 8px 18px;
            border-radius: 60px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🎁 Epic Gift</h1>
        <p style="color:#aab; margin-top:5px;">صناديق TON – افتح واربح</p>
    </div>

    <div class="balance-box">
        💰 الرصيد: <span id="balanceDisplay">100</span> TON
    </div>

    <div class="cases-grid" id="casesGrid">
        <!-- سيتم إنشاؤها بواسطة JS -->
    </div>

    <div class="result-area" id="resultArea">
        <div style="color:#aab;">اختر صندوقاً لبدء اللعب</div>
        <div class="prize" id="prizeDisplay"></div>
    </div>

    <button class="btn" id="openBtn">🔓 فتح الصندوق</button>

    <div class="stats">
        <div>🏆 فوز: <span class="num" id="winsCount">0</span></div>
        <div>💔 خسارة: <span class="num" id="lossesCount">0</span></div>
        <div>📦 افتتح: <span class="num" id="totalOpened">0</span></div>
    </div>

    <button class="reset-btn" id="resetBtn">🔄 إعادة الرصيد</button>

    <div class="history" id="historyLog">📜 سجل الجوائز...</div>
</div>

<script>
    // ===== الوضع الظلي V99 - Epic Gift =====
    let balance = 100;
    let wins = 0, losses = 0, totalOpened = 0;
    let selectedCase = null;
    let isOpening = false;

    const balanceSpan = document.getElementById('balanceDisplay');
    const resultArea = document.getElementById('resultArea');
    const prizeDisplay = document.getElementById('prizeDisplay');
    const historyLog = document.getElementById('historyLog');
    const winsSpan = document.getElementById('winsCount');
    const lossesSpan = document.getElementById('lossesCount');
    const totalSpan = document.getElementById('totalOpened');

    // تعريف الصناديق
    const cases = [
        { id: 'bronze', icon: '📦', name: 'برونزي', price: 5, minReward: 1, maxReward: 15, color: '#cd7f32' },
        { id: 'silver', icon: '🎁', name: 'فضي', price: 15, minReward: 5, maxReward: 40, color: '#c0c0c0' },
        { id: 'gold', icon: '👑', name: 'ذهبي', price: 35, minReward: 15, maxReward: 100, color: '#ffd700' },
        { id: 'platinum', icon: '💎', name: 'بلاتيني', price: 70, minReward: 40, maxReward: 250, color: '#e5e4e2' }
    ];

    // عرض الصناديق
    function renderCases() {
        const grid = document.getElementById('casesGrid');
        grid.innerHTML = cases.map(c => `
            <div class="case-card" data-id="${c.id}" style="border-color: ${selectedCase?.id === c.id ? '#f7931a' : '#f7931a40'}">
                <div class="icon">${c.icon}</div>
                <div style="font-weight:bold;margin:5px 0;">${c.name}</div>
                <div class="price">${c.price} TON</div>
                <div class="reward-range">${c.minReward} - ${c.maxReward} TON</div>
            </div>
        `).join('');

        // إضافة حدث الاختيار
        document.querySelectorAll('.case-card').forEach((card, index) => {
            card.onclick = () => {
                selectedCase = cases[index];
                document.querySelectorAll('.case-card').forEach(c => c.style.borderColor = '#f7931a40');
                card.style.borderColor = '#f7931a';
                resultArea.innerHTML = `<div style="color:#aab;">✅ تم اختيار: <strong>${selectedCase.name}</strong></div><div class="prize" id="prizeDisplay"></div>`;
                prizeDisplay.textContent = '';
            };
        });
    }

    // فتح الصندوق
    document.getElementById('openBtn').onclick = () => {
        if (isOpening) return;
        if (!selectedCase) { alert('اختر صندوقاً أولاً!'); return; }
        if (balance < selectedCase.price) { alert('الرصيد غير كافٍ!'); return; }

        isOpening = true;
        const caseData = selectedCase;
        balance -= caseData.price;
        updateBalance();

        // محاكاة التأثير
        resultArea.innerHTML = `<div style="color:#f7931a;">🔄 جاري الفتح...</div><div class="prize" id="prizeDisplay"></div>`;
        
        setTimeout(() => {
            const reward = Math.floor(Math.random() * (caseData.maxReward - caseData.minReward + 1)) + caseData.minReward;
            const isWin = reward > caseData.price * 1.2; // ربح إذا كان المكافأة أكبر من 1.2x السعر
            totalOpened++;
            if (isWin) { wins++; balance += reward; } 
            else { losses++; }
            
            updateBalance();
            updateStats();
            prizeDisplay.textContent = `${isWin ? '🎉' : '😞'} ${reward} TON`;
            resultArea.innerHTML = `
                <div style="color:${isWin ? '#6fcf97' : '#eb5757'};">
                    ${isWin ? '✅ ربحت!' : '❌ خسرت!'}
                </div>
                <div class="prize" id="prizeDisplay">${reward} TON</div>
                <div style="font-size:0.9rem;color:#aab;">(${caseData.name} - سعر ${caseData.price} TON)</div>
            `;
            addHistory(`${isWin ? '🏆' : '💔'} ${caseData.name}: ${reward} TON (${isWin ? 'ربح' : 'خسارة'})`, isWin ? 'win' : 'lose');
            isOpening = false;
        }, 800);
    };

    // إعادة الرصيد
    document.getElementById('resetBtn').onclick = () => {
        balance = 100;
        wins = 0; losses = 0; totalOpened = 0;
        updateBalance();
        updateStats();
        historyLog.innerHTML = '📜 تم إعادة التعيين...';
        resultArea.innerHTML = `<div style="color:#aab;">تم إعادة الرصيد إلى 100 TON</div><div class="prize" id="prizeDisplay"></div>`;
    };

    function updateBalance() {
        balanceSpan.textContent = balance;
        if (balance < 0) balance = 0;
    }

    function updateStats() {
        winsSpan.textContent = wins;
        lossesSpan.textContent = losses;
        totalSpan.textContent = totalOpened;
    }

    function addHistory(msg, type) {
        const div = document.createElement('div');
        div.textContent = msg;
        div.className = type;
        historyLog.prepend(div);
        if (historyLog.children.length > 12) historyLog.removeChild(historyLog.lastChild);
    }

    // تهيئة
    renderCases();
    updateBalance();
    updateStats();
    addHistory('🚀 مرحباً في Epic Gift! اختر صندوقاً وابدأ.', 'win');
</script>
</body>
</html>
