<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوت القمار - الوضع الظلي</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b0e14;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #f0e8d0;
        }
        .casino-container {
            background: #141a24;
            padding: 2rem;
            border-radius: 40px;
            box-shadow: 0 0 50px #f0b42940;
            border: 1px solid #f0b42960;
            width: 420px;
            text-align: center;
            transition: 0.3s;
        }
        h1 {
            font-size: 2.2rem;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #f7d875, #b8860b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px #f0b42980;
        }
        .balance {
            background: #1e2838;
            padding: 12px;
            border-radius: 60px;
            margin: 20px 0;
            font-size: 1.8rem;
            border: 1px solid #f0b429;
            box-shadow: inset 0 0 15px #f0b42930;
        }
        .balance span { color: #f7d875; font-weight: bold; }
        .dice-area {
            background: #0f151e;
            padding: 30px;
            border-radius: 30px;
            margin: 20px 0;
            border: 1px dashed #f0b42980;
        }
        .dice {
            font-size: 5rem;
            transition: 0.2s;
            display: inline-block;
            background: #1a2330;
            padding: 20px 40px;
            border-radius: 30px;
            box-shadow: 0 0 30px #f0b42920;
        }
        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 25px 0;
            flex-wrap: wrap;
        }
        input {
            background: #0b111a;
            border: 2px solid #f0b429;
            color: #f0e8d0;
            padding: 12px 20px;
            border-radius: 60px;
            width: 130px;
            font-size: 1.3rem;
            text-align: center;
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: #fff; box-shadow: 0 0 20px #f0b429; }
        button {
            background: #f0b429;
            border: none;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.2rem;
            color: #0b0e14;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 0 20px #f0b42960;
            letter-spacing: 1px;
        }
        button:hover {
            transform: scale(1.06);
            background: #ffc84a;
            box-shadow: 0 0 40px #f0b429;
        }
        button:active { transform: scale(0.95); }
        .history {
            margin-top: 20px;
            background: #0f151e;
            padding: 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: #aab;
            max-height: 100px;
            overflow-y: auto;
            border: 1px solid #f0b42940;
        }
        .history div { padding: 4px 0; border-bottom: 1px solid #1e2838; }
        .win { color: #6fcf97; }
        .lose { color: #eb5757; }
    </style>
</head>
<body>
<div class="casino-container">
    <h1>⚡ جيتون ⚡</h1>
    <div class="balance">💰 الرصيد: <span id="balanceDisplay">1000</span></div>
    <div class="dice-area">
        <div class="dice" id="diceFace">🎲</div>
        <div style="margin: 15px 0; font-size: 1.4rem; color: #f0b429;">تخمين الرقم</div>
    </div>
    <div class="controls">
        <input type="number" id="betAmount" value="50" min="1" step="1">
        <button id="rollBtn">🎰 رمي</button>
    </div>
    <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 10px;">
        <button id="guess1" style="background: #2d4059;">1</button>
        <button id="guess2" style="background: #2d4059;">2</button>
        <button id="guess3" style="background: #2d4059;">3</button>
        <button id="guess4" style="background: #2d4059;">4</button>
        <button id="guess5" style="background: #2d4059;">5</button>
        <button id="guess6" style="background: #2d4059;">6</button>
    </div>
    <div class="history" id="historyLog">📜 سجل اللعب...</div>
</div>

<script>
    // ===== الوضع الظلي V99 =====
    const balanceSpan = document.getElementById('balanceDisplay');
    const diceFace = document.getElementById('diceFace');
    const betInput = document.getElementById('betAmount');
    const historyLog = document.getElementById('historyLog');
    let balance = 1000;
    let currentGuess = null;

    // أزرار التخمين
    document.querySelectorAll('#guess1, #guess2, #guess3, #guess4, #guess5, #guess6').forEach(btn => {
        btn.addEventListener('click', () => {
            currentGuess = parseInt(btn.textContent);
            document.querySelectorAll('#guess1, #guess2, #guess3, #guess4, #guess5, #guess6')
                .forEach(b => b.style.background = '#2d4059');
            btn.style.background = '#f0b429';
            btn.style.color = '#0b0e14';
        });
    });

    // حدث الرمي
    document.getElementById('rollBtn').addEventListener('click', () => {
        if (currentGuess === null) {
            alert('اختر رقمًا أولاً (1-6)');
            return;
        }
        const bet = parseInt(betInput.value);
        if (isNaN(bet) || bet <= 0) {
            alert('ضع رهانًا صحيحًا');
            return;
        }
        if (bet > balance) {
            alert('الرصيد غير كافٍ');
            return;
        }

        // توليد النرد
        const result = Math.floor(Math.random() * 6) + 1;
        const diceEmojis = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
        diceFace.textContent = diceEmojis[result-1];

        // المقارنة
        const win = (result === currentGuess);
        let profit = 0;
        if (win) {
            profit = bet * 5;  // مضاعف 5:1
            balance += profit;
            addHistory(`🎉 ربحت ${profit} نقطة! (رقم ${result})`, 'win');
        } else {
            balance -= bet;
            addHistory(`😞 خسرت ${bet} نقطة. (كان ${result})`, 'lose');
        }

        balanceSpan.textContent = balance;
        if (balance <= 0) {
            balance = 1000;
            balanceSpan.textContent = balance;
            addHistory('🔄 تم إعادة الرصيد إلى 1000', 'win');
        }

        // إعادة تعيين التخمين
        currentGuess = null;
        document.querySelectorAll('#guess1, #guess2, #guess3, #guess4, #guess5, #guess6')
            .forEach(b => { b.style.background = '#2d4059'; b.style.color = '#f0e8d0'; });
    });

    function addHistory(msg, type) {
        const div = document.createElement('div');
        div.textContent = msg;
        div.className = type;
        historyLog.prepend(div);
        if (historyLog.children.length > 8) {
            historyLog.removeChild(historyLog.lastChild);
        }
    }

    // اختيار افتراضي
    document.getElementById('guess1').style.background = '#f0b429';
    document.getElementById('guess1').style.color = '#0b0e14';
    currentGuess = 1;
</script>
</body>
</html>
